version: 2

project_name: aw

builds:
  - main: ./cmd/aw
    binary: aw
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "aw_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
